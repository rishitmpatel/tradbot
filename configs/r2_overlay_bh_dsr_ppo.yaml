description: "PPO overlay on vol-targeted buy-and-hold; reward = differential Sharpe ratio"
# WHY: the goal is risk-adjusted profit, so reward the Sharpe ratio directly instead of
# 'profit minus hand-tuned penalties'. No drawdown penalty at all (kill switch still applies).
agent: {algo: PPO}
env: {base_signal: buy_and_hold, vol_target: 0.12, actions: [0, 0.5, 1], rebalance_band: 0.1}
reward: {type: differential_sharpe, scale: 1.0, drawdown_increase_penalty: 0.0, death_penalty: 2.0}
