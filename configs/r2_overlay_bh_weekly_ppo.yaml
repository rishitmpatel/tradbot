description: "r2_overlay_bh_ppo but the agent decides only every 5 days"
# WHY: daily returns are mostly noise and every switch costs 0.15%. Weekly decisions mean
# less noise to chase and fewer trades. 20k decisions ~ 100k trading days of experience.
agent: {algo: PPO, total_timesteps: 20000}
env: {base_signal: buy_and_hold, vol_target: 0.12, actions: [0, 0.5, 1], rebalance_band: 0.1, decision_interval: 5}
reward: {relative_to: base, drawdown_soft_limit: 0.08, drawdown_increase_penalty: 1.0, death_penalty: 0.2}
